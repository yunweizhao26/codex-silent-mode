[package]
name = "codex-silent"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "A collapsible terminal for Codex: keep answers visible and toggle tool activity."
license = "MIT"
repository = "https://github.com/yunweizhao26/codex-silent-mode"

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
