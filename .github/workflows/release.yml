name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "codex-silent"))')
          test "$RELEASE_TAG" = "v$package_version"
      - name: Install MUSL compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build client
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --bin codex-silent --target "$RELEASE_TARGET"
      - name: Package binary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/codex-silent-$RELEASE_TARGET.tar.gz" -C "target/$RELEASE_TARGET/release" codex-silent
      - uses: actions/upload-artifact@v4
        with:
          name: codex-silent-${{ matrix.target }}
          path: dist/codex-silent-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-silent-*
          merge-multiple: true
          path: dist
      - name: Create checksum manifest
        working-directory: dist
        run: |
          sha256sum \
            codex-silent-aarch64-apple-darwin.tar.gz \
            codex-silent-x86_64-apple-darwin.tar.gz \
            codex-silent-x86_64-unknown-linux-musl.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/codex-silent-aarch64-apple-darwin.tar.gz \
            dist/codex-silent-x86_64-apple-darwin.tar.gz \
            dist/codex-silent-x86_64-unknown-linux-musl.tar.gz \
            dist/SHA256SUMS
